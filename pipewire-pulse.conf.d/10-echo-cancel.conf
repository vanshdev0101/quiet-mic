# Loads PipeWire's pulse-compat echo-cancel module on every pipewire-pulse
# startup, so it survives reboot/logout without any manual pactl call.
#
# IMPORTANT: keep args as plain key=value with no embedded quotes. An
# earlier attempt used source_properties/sink_properties values with
# embedded single quotes, which corrupted pactl's own argument tokenizer
# and silently made source_master fall back to the wrong mic (the
# Bluetooth headset instead of the real USB mic) -- see README.md's S1
# notes for the full story.
#
# Node names hardcoded here are today's real names on this machine and
# are NOT stable across reboots/Bluetooth reconnects -- fixing that is
# S3 (WirePlumber node.name rules), not yet done.
pulse.cmd = [
    { cmd = "load-module" args = "module-echo-cancel source_name=aec_source sink_name=aec_sink source_master=alsa_input.usb-DCMT_Technology_USB_Condenser_Microphone_214b206000000178-00.mono-fallback sink_master=bluez_output.51_65_E6_58_40_2C.1 aec_method=webrtc" flags = [ nofail ] }
]

# Install: symlink or copy this file to
#   ~/.config/pipewire/pipewire-pulse.conf.d/10-echo-cancel.conf
# then `systemctl --user restart pipewire pipewire-pulse wireplumber`.
#
# After it loads, set aec_sink as your default output once:
#   wpctl set-default $(wpctl status | grep -m1 'aec_sink' | grep -oE '^\s*[0-9]+' )
# WirePlumber persists that choice by node.name across future restarts.
