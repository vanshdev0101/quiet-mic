# Loads PipeWire's pulse-compat echo-cancel module on every pipewire-pulse
# startup, so it survives reboot/logout without any manual pactl call.
#
# IMPORTANT: keep args as plain key=value with no embedded quotes. An
# earlier attempt used source_properties/sink_properties values with
# embedded single quotes, which corrupted pactl's own argument tokenizer
# and silently made source_master fall back to the wrong mic (the
# Bluetooth headset instead of the real USB mic) -- see quiet-mic's
# README/PLAN.md S1 notes for the full story.
#
# source_master/sink_master target the STABLE names assigned by
# ~/.config/wireplumber/wireplumber.conf.d/51-alsa-usb-mic.conf and
# 51-bluez-desktop.conf (S3), not the raw volatile hardware-suffixed names,
# so this survives reboots and Bluetooth reconnects.
pulse.cmd = [
    { cmd = "load-module" args = "module-echo-cancel source_name=aec_source sink_name=aec_sink source_master=usb_condenser_mic sink_master=bt_desktop_speaker aec_method=webrtc" flags = [ nofail ] }
]
