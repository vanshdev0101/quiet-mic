# Pins a stable node.name to the Bluetooth desktop speaker, keyed on its MAC
# (embedded in the current node name), so the AEC config in
# pipewire-pulse.conf.d/10-echo-cancel.conf can target a name that survives
# reconnects/profile changes instead of today's exact volatile suffixed name.
monitor.bluez.rules = [
  {
    matches = [
      { node.name = "~bluez_output\\.51_65_E6_58_40_2C\\..*" }
    ]
    actions = {
      update-props = {
        node.name = "bt_desktop_speaker"
        node.description = "Bluetooth Desktop Speaker"
      }
    }
  }
]
