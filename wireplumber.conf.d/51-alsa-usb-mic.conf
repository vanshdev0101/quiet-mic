# Pins a stable node.name to the USB condenser mic, keyed on its USB serial
# (embedded in the current node name), so the AEC config in
# pipewire-pulse.conf.d/10-echo-cancel.conf can target a name that survives
# reconnects instead of today's exact volatile fallback-suffixed name.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_input\\.usb-DCMT_Technology_USB_Condenser_Microphone_214b206000000178-00\\..*" }
    ]
    actions = {
      update-props = {
        node.name = "usb_condenser_mic"
        node.description = "USB Condenser Mic"
      }
    }
  }
]
